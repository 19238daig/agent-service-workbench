name: smart-cs-foundation
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_cs}
      POSTGRES_DB: ${POSTGRES_DB:-smart_cs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python -m smart_cs.foundation configure first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  job-redis:
    image: redis:7-alpine
    profiles: ["jobs"]
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "127.0.0.1:${JOB_REDIS_PORT:-56380}:6379"
    volumes:
      - job_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        PIP_INDEX_URL: ${WORKER_PIP_INDEX_URL:-https://pypi.org/simple}
    environment: &job_environment
      DATABASE_URL: postgresql+asyncpg://${JOB_DB_USER:-smart_cs_jobs}:${JOB_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-smart_cs}
      JOB_BROKER_URL: redis://job-redis:6379/0
      SMART_CS_WORKER_CONTAINER: "1"
      RAG_EMBEDDING_URL: http://host.docker.internal:61535
      RAG_RERANKER_URL: http://host.docker.internal:61536
      RAG_EMBEDDING_MODEL: smart-cs-bge-m3
    volumes: &job_volumes
      - ./data:/app/data
      - ./.local/background-jobs:/app/.local/background-jobs
    depends_on:
      postgres:
        condition: service_healthy
      job-redis:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  job-dispatcher:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        PIP_INDEX_URL: ${WORKER_PIP_INDEX_URL:-https://pypi.org/simple}
    command: python -m smart_cs.background.dispatcher
    environment: *job_environment
    volumes: *job_volumes
    depends_on:
      postgres:
        condition: service_healthy
      job-redis:
        condition: service_healthy
    mem_limit: 512m
    init: true
    restart: unless-stopped

  app:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      SMART_CS_PROJECT_ROOT: /app
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smart_cs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smart_cs}
      DATABASE_AUTO_CREATE: "false"
      FOUNDATION_AUTO_START: "false"
      APP_MODE: local_demo
      APP_ORIGINS: http://127.0.0.1:${APP_PORT:-8000},http://localhost:${APP_PORT:-8000}
      REDIS_URL: redis://redis:6379/0
      JOB_BROKER_URL: redis://job-redis:6379/0
      JOB_WORKER_AUTO_START: "false"
      RAG_EMBEDDING_URL: ${CONTAINER_EMBEDDING_URL:-http://host.docker.internal:61535}
      RAG_RERANKER_URL: ${CONTAINER_RERANKER_URL:-http://host.docker.internal:61536}
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - vector_data:/app/vector_store
      - ./data:/app/data
      - ./.local/background-jobs:/app/.local/background-jobs
      - app_state:/app/.local

  jaeger:
    image: jaegertracing/all-in-one:1.62
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres_data:
  redis_data:
  job_redis_data:
  vector_data:
  app_state:
