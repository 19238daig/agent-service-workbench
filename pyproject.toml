[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-cs-multi-agent"
version = "1.0.0"
description = "Python multi-agent customer service with LangGraph and FastAPI"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
smart-cs = "smart_cs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
smart_cs = ["retrieval/resources/*.txt", "retrieval/resources/*.json", "performance/*.json"]
